name: Build APK

# Se ejecuta cada vez que subes cambios a la rama main,
# o manualmente desde la pestaña "Actions" en GitHub.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Compilar APK con Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: .
          buildozer_version: stable

      - name: Subir el APK como artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: deshidratador-solar-apk
          path: ${{ steps.buildozer.outputs.filename }}
